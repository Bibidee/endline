name: ENDLINE CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install genvm-linter
      - run: genvm-lint lint contracts/endline.py
      - run: genvm-lint validate contracts/endline.py
      - run: genvm-lint schema contracts/endline.py --output artifacts/endline.schema.json --json
      - run: genvm-lint typecheck contracts/endline.py
      - run: python -m pip install "genlayer-test @ git+https://github.com/genlayerlabs/genlayer-testing-suite.git@8f8e802350140239be2b37590ed7a68253634ec5"
      - run: pytest tests/direct -v
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: ESLINT_USE_FLAT_CONFIG=false npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
